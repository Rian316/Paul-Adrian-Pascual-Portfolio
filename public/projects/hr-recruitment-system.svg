<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="HR Recruitment System cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#e2e8f0" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect x="0" y="0" width="1600" height="240" fill="url(#sheen)"/>
  <g opacity="0.9">
    <rect x="120" y="180" width="1360" height="4" rx="2" fill="#e2e8f0" fill-opacity="0.25"/>
    <rect x="120" y="720" width="980" height="4" rx="2" fill="#e2e8f0" fill-opacity="0.25"/>
  </g>
  <text x="120" y="300" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="1">HR Recruitment</text>
  <text x="120" y="380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial" font-size="52" font-weight="600" fill="#f9a8d4" letter-spacing="0.5">System</text>
  <text x="120" y="640" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="30" fill="#e2e8f0" fill-opacity="0.75">NEXT.JS 16 · PRISMA 7 · TYPESCRIPT · SQLITE</text>
</svg>
